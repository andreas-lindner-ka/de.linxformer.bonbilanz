name: Deploy to netcup
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          state-name: .ftp-deploy-bonbilanz.json
          server: hosting237916.ae876.netcup.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /bonbilanz.linxformer.de/httpdocs/
          protocol: ftps
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            README.md
